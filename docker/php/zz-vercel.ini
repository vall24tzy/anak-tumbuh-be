; DEPLOY-IMAGE-001: pengaturan PHP untuk image Vercel (dimuat setelah ini bawaan: prefiks zz-).
;
; Batas upload: aplikasi membatasi file import 4 MB (D-29) dan foto/logo 2 MB. PHP harus LEBIH LONGGAR dari
; batas aplikasi, kalau tidak PHP menolak file lebih dulu dan respons 422 sesuai Contract tidak pernah muncul.
; Batas body request Vercel (4,5 MB menurut Task Board; belum diverifikasi) tetap menjadi batas efektif.
upload_max_filesize = 5M
; post_max_size mencakup seluruh body multipart (file + field lain), jadi diberi ruang di atas upload_max_filesize.
post_max_size = 6M

; DEPLOY-PILOT-001: batas waktu eksekusi. Bawaan PHP 30 detik memotong import siswa 150 baris di Vercel
; (500 setelah 30,2 detik, BcryptHasher). Batas Vercel Hobby 300 detik; PHP diberi batas lebih rendah supaya
; kegagalan muncul sebagai error aplikasi yang tercatat, bukan pemutusan paksa oleh platform. NILAI AWAL:
; ditinjau ulang setelah durasi import siswa 150 sampai 200 baris diukur di PILOT.
max_execution_time = 120

; Direktori sementara upload dan file sementara PHP: /tmp (butir 8c).
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

; Produksi: jangan tampilkan error ke klien dan jangan bocorkan versi PHP. Log lewat stderr (SAPI).
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Berkas kode tidak berubah selama container hidup.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
